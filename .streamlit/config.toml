[theme]
base = "light"
primaryColor = "#1F3A5F"
backgroundColor = "#FFFFFF"
secondaryBackgroundColor = "#F5F7FA"
textColor = "#101828"
font = "sans serif"

[client]
toolbarMode = "viewer"        # no developer menu for operations users
showErrorDetails = false      # never show stack traces to users; errors go to the server log

[server]
maxUploadSize = 20            # MB
enableXsrfProtection = true

[browser]
gatherUsageStats = false
